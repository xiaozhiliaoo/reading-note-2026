[book]
authors = ["lili"]
language = "zh_CN"
src = "src"
title = "阅读笔记"
description = "阅读笔记"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
theme = "mytheme"
default-theme = "light" #  light、rust、coal、navy
git-repository-url = "https://github.com/xiaozhiliaoo/reading-note-2026"
additional-js = ["mermaid.min.js", "mermaid-init.js", "smart-anchor.js"]
mathjax-support = true

[output.html.playground]
editable = true
copy-js = true

[output.html.fold]
enable = true
level = 0

[preprocessor.rss]
files-glob = "chapter_*/**/*.md"
url-base = "https://github.com/xiaozhiliaoo/reading-note-2026/"

# [output.latex]
# latex    = true  # default = true
# pdf      = true  # default = false
# markdown = true  # default = false


